[package]
name = "flowrly"
version = "0.1.0"
description = "Flowrly: time tracking and invoicing for freelancers"
authors = ["Lubos Matejcik"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowrly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Flowrly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rusqlite_migration = "~2.5"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
schemars = "1"
rig = { version = "0.42", package = "rig-core" }
rig-agent = "0.42"
active-win-pos-rs = "0.11"
user-idle = "0.6"



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
