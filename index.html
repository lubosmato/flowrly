<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flowrly</title>
    <style>
      /* Painted before any JS/CSS loads: never flash white. Keep in sync with --background. */
      html { background: oklch(0.975 0.012 85); }
      @media (prefers-color-scheme: dark) { html { background: oklch(0.17 0.04 268); } }
      #root { opacity: 0; }
      #root.ready { animation: app-enter 420ms ease-out forwards; }
      @keyframes app-enter { from { opacity: 0; transform: scale(0.992); } to { opacity: 1; transform: none; } }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
